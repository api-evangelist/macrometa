aid: macrometa
name: Macrometa
description: >-
  Macrometa is a global data network and edge computing platform. Its Global
  Data Network (GDN) provides a geo-distributed, serverless NoSQL database,
  pub/sub streams, complex event processing, and edge functions through a
  unified REST API plus first-party Python (pyC8) and JavaScript (jsC8) SDKs.
  Macrometa has since expanded into PhotonIQ, an AI-powered edge delivery suite
  for web performance and digital operations — prerendering, edge-side tagging,
  function-as-a-service, digital fingerprinting, virtual waiting rooms, event
  delivery, and hypersearch. This profile catalogs Macrometa's published
  OpenAPI surface across the GDN core and the PhotonIQ product family, along
  with its SDKs, CLI, status page, and developer documentation.
