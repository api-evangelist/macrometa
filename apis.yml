- aid: macrometa:macrometa-triggers-api
  name: Macrometa Triggers API
  description: >-
    This endpoint is designed for configuring triggers for a specific component. Triggers are essential
    for initiating actions within a component, as they define the specific conditions  under which these
    actions are executed. Each trigger consists of one or more rules, known as Trigger Rules, which collectively
    determine when an action should be started. In the  configuration process, you can define various
    types of Trigger Rules, each tailored to different conditions and scenarios. This flexibility allows
    for precise control over component behavior,  enabling actions to be executed in response to defined
    events or states. It is crucial to accurately set up triggers to ensure the proper functioning of
    the component within your website's  architecture. By using this endpoint, you can create, modify,
    or delete trigger configurations, thereby customizing how and when your component reacts to specific
    conditions or user interactions.
  humanURL: https://www.macrometa.com/docs/api
  baseURL: https://api-play.paas.macrometa.io
  tags:
  - Triggers
  properties:
  - type: OpenAPI
    url: openapi/macrometa-triggers-api-openapi.yml
