components:
  schemas:
    UsageMetrics:
      type: object
      properties:
        customerId:
          type: string
          description: ID of the customer.
        usedRequests:
          type: number
          description: Number of requests made by the customer.
        usedBytes:
          type: number
          description: Number of bytes used.
