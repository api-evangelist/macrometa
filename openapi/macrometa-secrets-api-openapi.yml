components:
  requestBodies:
    create_secret_request:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/create_secret_request'
      description: JSON for a new secret.
      required: true
    update_secret_request:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/update_secret_request'
      description: JSON for updating a secret.
      required: true
  schemas:
    update_secret_request:
      type: object
      properties:
        value:
          type: string
          example: my updated value
        fileName:
          type: string
          example: null
        keyName:
          type: string
          example: null
    error_example_rc_403:
      properties:
        code:
          description: HTTP response code.
          type: integer
          example: 403
        error:
          description: Flag if there is an error in response. *True* for this response.
          type: boolean
          example: true
        errorMessage:
          description: A message created for this error.
          type: string
          example: Error message
        errorNum:
          description: Error number returned from the database.
          type: integer
          example: 581
      required:
      - error
      type: object
    get_secret_examples_rc_200:
      properties:
        error:
          description: Flag if there is an error in response. *False* for this response.
          type: boolean
          example: false
        code:
          description: The generated response code.
          type: integer
          example: 200
        result:
          type: object
          properties:
            name:
              type: string
              example: secret_name_1
            value:
              type: string
              example: my value
            fileName:
              type: string
              example: null
            tenant:
              type: string
              example: _mm
            fabric:
              type: string
              example: _system
            keyName:
              type: string
              example: managed_key_1
            keyId:
              type: string
              example: I1tcRHpOqEtvOxw9z90WjQ.EmcLClY
            createdAt:
              type: number
              example: 1689020889736
            updatedAt:
              type: number
              example: 1689020889736
    error_example_rc_404:
      properties:
        code:
          description: HTTP response code.
          type: integer
          example: 404
        error:
          description: Flag if there is an error in response. *True* for this response.
          type: boolean
          example: true
        errorMessage:
          description: A message created for this error.
          type: string
          example: Error message
        errorNum:
          description: Error number returned from the database.
          type: integer
          example: 581
      required:
      - error
      type: object
    create_secret_request:
      type: object
      properties:
        name:
          type: string
          example: secret_name_1
        value:
          type: string
          example: my value
        fileName:
          type: string
          example: null
        keyName:
          type: string
          example: null
    headers:
      x-gdn-region:
        description: The federation's region hostname that served the request.
        type: string
      x-gdn-requestid:
        description: A unique request ID for each API request.
        type: string
    delete_all_secret_example_rc_200:
      properties:
        error:
          description: Flag if there is an error in response. *False* for this response.
          type: boolean
          example: false
        code:
          description: The generated response code. `value` property always returns as `null`.
          type: integer
          example: 200
        result:
          type: array
          items:
            type: string
    error_example_rc_412:
      properties:
        code:
          description: HTTP response code.
          type: integer
          example: 412
        error:
          description: Flag if there is an error in response. *True* for this response.
          type: boolean
          example: true
        errorMessage:
          description: A message created for this error.
          type: string
          example: Error message
        errorNum:
          description: Error number returned from the database.
          type: integer
          example: 581
      required:
      - error
      type: object
    error_example_rc_409:
      properties:
        code:
          description: HTTP response code.
          type: integer
          example: 409
        error:
          description: Flag if there is an error in response. *True* for this response.
          type: boolean
          example: true
        errorMessage:
          description: A message created for this error.
          type: string
          example: Error message
        errorNum:
          description: Error number returned from the database.
          type: integer
          example: 581
      required:
      - error
      type: object
    error_example_rc_401:
      properties:
        code:
          description: HTTP response code.
          type: integer
          example: 401
        error:
          description: Flag if there is an error in response. *True* for this response.
          type: boolean
          example: true
        errorMessage:
          description: A message created for this error.
          type: string
          example: Error message
        errorNum:
          description: Error number returned from the database.
          type: integer
          example: '102020'
      required:
      - error
      type: object
    create_secret_example_rc_200:
      properties:
        error:
          description: Flag if there is an error in response. *False* for this response.
          type: boolean
          example: false
        code:
          description: The generated response code. `value` property always returns as `null`.
          type: integer
          example: 200
        result:
          type: object
          properties:
            name:
              type: string
              example: secret_name_1
            value:
              type: string
              example: null
            fileName:
              type: string
              example: null
            tenant:
              type: string
              example: _mm
            fabric:
              type: string
              example: _system
            keyName:
              type: string
              example: managed_key_1
            keyId:
              type: string
              example: I1tcRHpOqEtvOxw9z90WjQ.EmcLClY
            createdAt:
              type: number
              example: 1689020889736
            updatedAt:
              type: number
              example: 1689020889736
    get_all_secrets_examples_rc_200:
      properties:
        error:
          description: Flag if there is an error in response. *False* for this response.
          type: boolean
          example: false
        code:
          description: The generated response code. `value` property always returns as `null`.
          type: integer
          example: 200
        result:
          type: object
          properties:
            total:
              description: Total secrets found.
              type: integer
              example: 100
            offset:
              description: Fetch secrets from offset.
              type: integer
              example: 0
            count:
              description: Count secrets to return.
              type: integer
              example: 50
            items:
              description: An array of secrets.
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                    example: secret_name_1
                  value:
                    type: string
                    example: null
                  fileName:
                    type: string
                    example: null
                  tenant:
                    type: string
                    example: _mm
                  fabric:
                    type: string
                    example: _system
                  createdAt:
                    type: number
                    example: 1689020889736
                  updatedAt:
                    type: number
                    example: 1689020889736
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Provide an API Key to the `Authorization` header, prefixed with "apikey".


        Example: `Authorization: apikey <key>`'
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Provide a JSON Web Token (JWT) to the `Authorization` header, prefixed with "bearer".


        Example: `Authorization: bearer <jwt>`'
