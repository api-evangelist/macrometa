        name: command
        description: "The command which decides the mode of sync operation. The allowed values are: \n  - region_add(To sync the newly added region.)\n  - region_add_copy_local(Add region and copy local collections data)\n  - catchup_start(Start sync in catchup mode.)\n  - catchup_pause(Pause the sync in catchup mode.)\n  - catchup_resume(Resume the sync in catchup mode.)\n  - catchup_kill(Stop the sync in catchup mode.) "
