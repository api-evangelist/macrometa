        **Note**:

        - Synchronize all *tenants* from remote regions, including all *GeoFabrics* created for each tenant.

        - While the new data center is being added to the all fabrics, the new data center is not available for normal operations until after the synchronization is finished.

        - Requires *administrator* permissions.'
      operationId: AddDatacentersToAllTenant(superuser)
