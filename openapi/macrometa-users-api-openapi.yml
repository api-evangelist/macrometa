    user_modify:
      properties:
        active:
          description: If set to _true_, then the user is active.
          type: boolean
          default: true
        passwd:
          description: The user password. The password must have at least 8 characters, one uppercase letter, one lowercase letter, one number, and one special character (!@#$%^&*).
          type: string
          example: P@55w0rd
        displayName:
          description: The user name.
          type: string
          example: joe
        newEmail:
          description: User's email. Requires *administrator* permissions.
          properties:
            email:
              description: The user email.
              type: string
              example: example@xxx.com
