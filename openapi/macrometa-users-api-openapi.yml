components:
  schemas:
    user_grant_database:
      properties:
        grant:
          description: '- Use "rw" to set the GeoFabric access level to *Administrate*.

            - Use "ro" to set the GeoFabric access level to *Access*.

            - Use "none" to set the database access level to *No access*.'
          type: string
          example: rw
      required:
      - grant
      type: object
    user_create:
      properties:
        active:
          description: If set to *true*, the user is active.
          format: boolean
          type: boolean
          default: true
        email:
          description: The email of the user.
          type: string
          example: test@bar.com
        passwd:
          description: The user password. The password must have at least 8 characters, one uppercase letter, one lowercase letter, one number, and one special character (!@#$%^&*).
          type: string
          example: P@55w0rd
        displayName:
          description: The display name of the user.
          type: string
          example: Jhon Doe
      required:
      - email
      - passwd
      type: object
    headers:
      x-gdn-region:
        description: The federation's region hostname that served the request.
        type: string
      x-gdn-requestid:
        description: A unique request ID for each API request.
        type: string
    user_grant_queryworker:
      properties:
        grant:
          description: '- Use "rw" to set the query worker level access to *Read/Write*.

            - Use "ro" to set the query worker level access to *Read Only*.

            - Use "none" to set the query worker level access to *No access*.'
          type: string
          example: rw
      required:
      - grant
      type: object
    http_examples_rc_200_attributes:
      properties:
        code:
          description: HTTP response code.
          type: integer
          example: 200
        error:
          description: Flag if there is an error in response. *False* for this response.
          type: boolean
          example: false
        result:
          $ref: '#/components/schemas/attribute_values'
    user_grant_collection:
      properties:
        grant:
          description: '- Use "rw" to set the collection level access to *Read/Write*.

            - Use "ro" to set the collection level access to *Read Only*.

            - Use "none" to set the collection level access to *No access*.'
          type: string
          example: rw
      required:
      - grant
      type: object
    error_example_rc_404:
      properties:
        code:
          description: HTTP response code.
          type: integer
          example: 404
        error:
          description: Flag if there is an error in response. *True* for this response.
          type: boolean
          example: true
        errorMessage:
          description: A message created for this error.
          type: string
          example: Error message
        errorNum:
          description: Error number returned from the database.
          type: integer
          example: 581
      required:
      - error
      type: object
    api_key_http_examples_rc_200_0:
      properties:
        code:
          description: HTTP response code.
          type: integer
          example: 200
        error:
          description: Flag if there is an error in response. *False*for this response.
          type: boolean
          example: false
        tenant:
          description: The name of the tenant.
          type: string
          example: _mm
        user:
          description: The id of the user.
          type: string
          example: Ugr0xjYMS9y0eN5gBxSSmg
        displayName:
          description: The username of the tenant.
          type: string
          example: test1
        email:
          description: The email of this API key.
          type: string
          example: test@foo.com
        active:
          description: Active status the API key.
          type: boolean
          example: true
        apikey:
          description: Hash of API key.
          type: object
          properties:
            hash:
              description: Hash of API key.
              type: string
              example: 1467ad2eed8e823f5a5db74aacd716d2f87dc3dde2bced8799e3c07dcf1c88ee
