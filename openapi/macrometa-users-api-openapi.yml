          type: object
      type: object
    attribute_values:
      properties:
        key1:
          description: Attribute key-value.
          format: string
          type: string
          example: value1
        key2:
          description: Attribute key-value.
          format: string
          type: string
          example: value2
    user_grant_managedkey:
      properties:
        grant:
          description: '- Use "rw" to set the managed key level access to *Read/Write*.

            - Use "ro" to set the managed key level access to *Read Only*.

            - Use "none" to set the managed key level access to *No access*.'
          type: string
          example: rw
      required:
      - grant
      type: object
  requestBodies:
    user_grant_queryworker:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/user_grant_queryworker'
      required: true
    user_grant_collection:
      content:
