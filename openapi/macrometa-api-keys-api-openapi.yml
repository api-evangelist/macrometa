  /_api/key/{keyid}/database/{dbname}/collection:
    get:
      description: "Fetch the list of collections access level for a specific *user*\n\n If access level for collection is not set default(\"&#42;\") access level is used. If default(\"&#42;\") access level is also not set database access level is used."
      operationId: GetTheApiKeyCollectionsAccessLevel
      parameters:
      - description: The id of the API key.
        in: path
        name: keyid
        required: true
        schema:
          type: string
          format: string
      - description: The name of the database to query.
        in: path
        name: dbname
        required: true
        schema:
          type: string
          format: string
          default: _system
      - description: Return the full set of access levels for all collections.
        in: query
        name: full
        required: false
        schema:
