  schemas:
    edge_worker_rc_200:
      type: object
      properties:
        code:
          description: HTTP response code.
          type: integer
          example: 200
        error:
          description: Flag if there is an error in response. *False* for this response.
          type: boolean
          example: false
        result:
          items:
            type: object
            properties:
              activationStatus:
                type: string
                example: ACTIVE
                description: Edge function activation status.
              description:
                type: string
                example: Get animal details edge function.
                description: Description about edge function.
              edgeWorkerId:
                type: number
                example: 59283
                description: Edge function identifier.
              name:
                type: string
                example: mmFnworker
                description: Name of the edge function.
              type:
                type: string
                example: akamai
                description: Type of the edge function.
                enum:
                - akamai
                - macrometa
              environment:
                type: string
                example: PRODUCTION
                description: Edge function activation environment.
              url:
                type: string
                example: mmfnworker.macrometa.io/
