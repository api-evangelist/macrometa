  /api/faas/v1/deploy:
    post:
      tags:
      - Function
      summary: Deploy the function
      description: 'This endpoint allows you to deploy a function by specifying its unique function name. Unique Function name is defined in `.toml`.

        The function code and configuration details are required to complete the deployment.

        The function code should be provided as a `.js` or `.wasm` file, and the configuration details should be in a `.toml` file format.

        Both files should be included in the multipart form data.'
      operationId: handle_mm_deploy
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FunctionDataForm'
        required: true
      responses:
        '200':
          description: The function was successfully deployed.
        '401':
          description: Authorization failure due to invalid authentication credentials.
        '403':
          description: Either the API key doesn't have permissions or it is deactivated.
        '404':
          description: Not found.
        '500':
          description: Internal server error.
        '503':
          description: Service unavailable.
      security:
      - apikey: []
  /api/faas/v1/download/{functionName}:
