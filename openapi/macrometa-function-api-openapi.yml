  /_fabric/{fabric}/_api/function/generate:
    post:
      description: 'Deploy the query worker to the edge worker environment.


        **Note**: The edge worker activation is delayed while the environment is setup. Use the get edge function information API to get the activation status of the edge worker.'
      operationId: GenerateFunctionWorkerFromQueryWorker
      parameters:
      - in: path
        name: fabric
        required: true
        description: The name of the fabric.
        schema:
          type: string
          format: string
          default: _system
      - name: type
        in: query
        description: Type of edge worker.
        schema:
          type: string
          enum:
          - akamai
          default: akamai
      - name: name
        required: true
        in: query
        description: Name of the edge worker.
        schema:
          type: string
      - name: queryWorkerName
        required: true
        in: query
        description: Name of the Macrometa query worker.
        schema:
          type: string
      - name: environment
        required: false
        in: query
        description: The environment in which the edge worker is activated.
        schema:
          type: string
          enum:
          - STAGING
          - PRODUCTION
          default: PRODUCTION
      responses:
        '202':
          description: Successfully deployed the query worker to the edge worker.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generate_edge_worker_from_query_worker_rc_200'
          headers:
            x-gdn-region:
              schema:
                $ref: '#/components/schemas/headers/x-gdn-region'
            x-gdn-requestid:
              schema:
                $ref: '#/components/schemas/headers/x-gdn-requestid'
        '400':
          description: Failed due to missing or malformed data. Verify that all parameters are complete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_example_rc_400'
          headers:
            x-gdn-region:
              schema:
                $ref: '#/components/schemas/headers/x-gdn-region'
            x-gdn-requestid:
              schema:
                $ref: '#/components/schemas/headers/x-gdn-requestid'
        '401':
          description: Failed because you do not have administrator permissions.
