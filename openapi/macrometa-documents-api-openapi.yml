        required: false
        schema:
          type: boolean
          default: false
      - description: If set to *true*, adds the new documents to the *new* attribute.
        in: query
        name: returnNew
        required: false
        schema:
          type: boolean
          default: false
      - description: If set to *true*, an empty object is returned as response. No meta-data is returned for the replaced document. This option can be used to save some network traffic.
        in: query
        name: silent
        required: false
        schema:
          type: boolean
          default: true
      - description: If set to *true*, returns only after data has been synced to disk.
        in: query
        name: waitForSync
        required: false
        schema:
          type: boolean
          default: false
      - description: You can conditionally replace a document based on a target revision id by using the *if-match* HTTP header.
        in: header
        name: If-Match
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                item1: data1
        description: A JSON representation of a single document.
        required: true
      responses:
        '201':
          description: Successfully replaced documents when *waitForSync* is enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/examples_id_key_rev_oldrev'
          headers:
            x-gdn-region:
              schema:
