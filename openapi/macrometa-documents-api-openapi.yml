        required: true
        schema:
          type: string
          format: string
      - description: If set to *true*, the *_rev* attributes in the given document is ignored. If set to *false*, the *_rev* attribute given in the body document is taken as a precondition. The document is only replaced if the current revision is the one specified.
        in: query
        name: ignoreRevs
        required: false
        schema:
          type: boolean
          default: true
      - description: If set to *true*, adds the *old* attribute which displays document revisions.
        in: query
