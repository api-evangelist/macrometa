              schema:
                $ref: '#/components/schemas/document_get_412'
          headers:
            x-gdn-region:
              schema:
                $ref: '#/components/schemas/headers/x-gdn-region'
            x-gdn-requestid:
              schema:
                $ref: '#/components/schemas/headers/x-gdn-requestid'
      summary: Remove a document
      tags:
      - Documents
    get:
      description: "Fetch the document identified by *key*. The returned document contains three special attributes:\n - *_id* containing the document handle.\n - *_key* containing key which uniquely identifies a document.\n - *_rev* containing the revision."
      operationId: readDocument
      parameters:
      - in: path
        name: fabric
        required: true
        description: The name of the fabric.
        schema:
          type: string
          format: string
          default: _system
      - description: The name of the collection.
        in: path
        name: collection
        required: true
        schema:
          type: string
          format: string
      - description: The key of the document.
        in: path
        name: key
        required: true
        schema:
          type: string
          format: string
      - description: If the *If-None-Match* header is given, it must contain exactly one ETag. The document is returned, if it has a different revision than the given ETag. Otherwise a *HTTP 304* is returned.
        in: header
        name: If-None-Match
        schema:
          type: string
      - description: If the *If-Match* header is given, it must contain exactly one ETag. The document is returned, if it has the same revision as the given ETag. Otherwise a *HTTP 412* is returned.
        in: header
        name: If-Match
        schema:
          type: string
      responses:
        '200':
          description: Successfully fetched document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/examples_id_key_rev_data'
          headers:
            x-gdn-region:
              schema:
                $ref: '#/components/schemas/headers/x-gdn-region'
            x-gdn-requestid:
              schema:
                $ref: '#/components/schemas/headers/x-gdn-requestid'
        '304':
          description: Document has the same revision if the *If-None-Match* header is given.
          content:
            application/json:
              schema:
                type: string
                example: 'Error: Not modified'
          headers:
            x-gdn-region:
              schema:
                $ref: '#/components/schemas/headers/x-gdn-region'
            x-gdn-requestid:
              schema:
                $ref: '#/components/schemas/headers/x-gdn-requestid'
        '404':
          description: Failed to find the specified collection or document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_example_rc_404'
          headers:
            x-gdn-region:
              schema:
                $ref: '#/components/schemas/headers/x-gdn-region'
            x-gdn-requestid:
              schema:
                $ref: '#/components/schemas/headers/x-gdn-requestid'
        '412':
          description: Document has different version if an *If-Match* header is given. The response contains the found document's current revision in the *_rev* attribute. Additionally, the attributes *_id* and *_key* are returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/document_get_412'
          headers:
            x-gdn-region:
              schema:
                $ref: '#/components/schemas/headers/x-gdn-region'
            x-gdn-requestid:
              schema:
                $ref: '#/components/schemas/headers/x-gdn-requestid'
      summary: Read document
      tags:
      - Documents
    head:
      description: Like GET, but only fetch the header fields and not the body. You can use this call to get the current revision of a document or check if the document was deleted.
      operationId: checkDocument
      parameters:
      - in: path
        name: fabric
        required: true
        description: The name of the fabric.
        schema:
          type: string
          format: string
          default: _system
      - description: The name of the collection.
        in: path
        name: collection
        required: true
        schema:
          type: string
          format: string
      - description: The key of the document.
        in: path
        name: key
        required: true
        schema:
          type: string
          format: string
      - description: If the *If-None-Match* header is given, it must contain exactly one ETag. If the current document revision is not equal to the specified ETag, a *HTTP 200* response is returned. If the current document revision is identical to the specified ETag, a *HTTP 304* is returned.
        in: header
        name: If-None-Match
        schema:
          type: string
      - description: If the *If-Match* header is given, it must contain exactly one ETag. The document is returned, if it has the same revision as the given ETag. Otherwise a *HTTP 412* is returned.
        in: header
        name: If-Match
        schema:
          type: string
      responses:
        '200':
          description: Successfully fetched headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/examples_id_key_rev_data'
          headers:
            x-gdn-region:
              schema:
                $ref: '#/components/schemas/headers/x-gdn-region'
            x-gdn-requestid:
              schema:
                $ref: '#/components/schemas/headers/x-gdn-requestid'
        '304':
          description: Document has the same version if the *If-None-Match* header is given.
          content:
            application/json:
              schema:
                type: string
                example: 'Error: Not modified'
          headers:
            x-gdn-region:
              schema:
                $ref: '#/components/schemas/headers/x-gdn-region'
            x-gdn-requestid:
              schema:
                $ref: '#/components/schemas/headers/x-gdn-requestid'
        '404':
          description: Failed to find the specified collection or document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_example_rc_404'
          headers:
            x-gdn-region:
              schema:
                $ref: '#/components/schemas/headers/x-gdn-region'
            x-gdn-requestid:
              schema:
                $ref: '#/components/schemas/headers/x-gdn-requestid'
        '412':
          description: Document has different version if an *If-Match* header is given. The response contains the found document's current revision in the *_rev* attribute. Additionally, the attributes *_id* and *_key* are returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/document_get_412'
          headers:
            x-gdn-region:
              schema:
                $ref: '#/components/schemas/headers/x-gdn-region'
            x-gdn-requestid:
              schema:
                $ref: '#/components/schemas/headers/x-gdn-requestid'
      summary: Read document header
      tags:
      - Documents
    patch:
      description: "Partially updates the document identified by *key*. The body of the request must contain a JSON document with the attributes to patch (the patch document). All attributes from the patch document are added to the existing document if they do not yet exist, and overwritten in the existing document if they do exist there.\n\nSetting an attribute value to *null* in the patch document causes a value of *null* to be saved for the attribute by default.\n\nIf the *If-Match* header is specified and the revision of the document in the database is unequal to the given revision, the precondition is violated.\n\nIf *If-Match* is not given and *ignoreRevs* is *false*, a *_rev* attribute in each document bodymust match the revision of the corresponding document in the database. Otherwise, the call fails.\n\nIf a precondition is violated, a *HTTP 412* is returned.\n\nIf the document exists and can be updated, a *HTTP 201* or a *HTTP 202* is returned, the *ETag* header field contains the new revision of the document (in double quotes) and the *Location* header contains a URL under which the document can be queried.\n\nIf *silent* is set to *false*, the body of the response contains a JSON object with the information about the handle and the revision.\n - *_id* contains the known *document-handle* of the updated document.\n - *_key* contains the key that uniquely identifies a document.\n - *_rev* contains the new document revision.\n\nIf the query parameter *returnOld* is *true*, the previous revision of the document is returned under the *old* attribute in the result.\n\nIf the query parameter *returnNew* is *true*, the new document is returned under the *new* attribute in the result.\n\nIf the document does not exist, a *HTTP 404* is returned and the body of the response contains an error document."
      operationId: updateDocument2
      parameters:
      - in: path
        name: fabric
        required: true
        description: The name of the fabric.
        schema:
          type: string
          format: string
          default: _system
      - description: The name of the collection.
        in: path
        name: collection
        required: true
        schema:
          type: string
          format: string
      - description: This URL parameter must be a document key.
        in: path
        name: key
        required: true
        schema:
          type: string
          format: string
      - description: If the intention is to remove existing attributes with the patch command, the URL query parameter *keepNull* can be used with a value of *false*. This modifies the behavior of the patch command to remove any attributes from the existing document that are contained in the patch document with an attribute value of *null*.
        in: query
        name: keepNull
        required: false
        schema:
          type: boolean
          default: false
      - description: Controls whether objects (not arrays) is merged if present in both the existing and the patch document. If set to *false*, the value in the patch document overwrites the existing document's value. If set to *true*, objects is merged. The default is *true*.
        in: query
        name: mergeObjects
        required: false
        schema:
          type: boolean
          default: true
      - description: If set to *true*, the *_rev* attributes in the given document is ignored. If set to *false*, the *_rev* attribute given in the body document is taken as a precondition. The document is only updated if the current revision is the one specified.
        in: query
        name: ignoreRevs
        required: false
        schema:
          type: boolean
          default: true
      - description: If set to *true*, adds the *old* attribute which displays document revisions.
        in: query
        name: returnOld
        required: false
        schema:
          type: boolean
          default: false
      - description: If set to *true*, adds the new documents to the *new* attribute.
        in: query
        name: returnNew
        required: false
        schema:
          type: boolean
          default: false
      - description: If set to *true*, an empty object is returned as response. No meta-data is returned for the updated document. This option can be used to save some network traffic.
        in: query
        name: silent
        required: false
        schema:
          type: boolean
          default: true
      - description: If set to *true*, returns only after data has been synced to disk.
        in: query
        name: waitForSync
        required: false
        schema:
          type: boolean
          default: false
      - description: You can conditionally update a document based on a target revision id by using the *if-match* HTTP header.
        in: header
        name: If-Match
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                _key: key1
                item1: data1
        description: A JSON representation of a document update as an object.
        required: true
      responses:
        '201':
          description: Successfully updated document when *waitForSync* is enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/examples_id_key_rev_oldrev'
          headers:
            x-gdn-region:
              schema:
                $ref: '#/components/schemas/headers/x-gdn-region'
            x-gdn-requestid:
              schema:
                $ref: '#/components/schemas/headers/x-gdn-requestid'
        '202':
          description: Successfully updated document when *waitForSync* is disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/examples_id_key_rev_oldrev'
          headers:
            x-gdn-region:
              schema:
                $ref: '#/components/schemas/headers/x-gdn-region'
            x-gdn-requestid:
              schema:
                $ref: '#/components/schemas/headers/x-gdn-requestid'
        '400':
          description: Failed due to missing or malformed data. Verify that all parameters are complete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_example_rc_400'
          headers:
            x-gdn-region:
              schema:
                $ref: '#/components/schemas/headers/x-gdn-region'
            x-gdn-requestid:
              schema:
                $ref: '#/components/schemas/headers/x-gdn-requestid'
        '404':
          description: Failed to find specified collection or document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_example_rc_404'
          headers:
            x-gdn-region:
              schema:
                $ref: '#/components/schemas/headers/x-gdn-region'
            x-gdn-requestid:
              schema:
                $ref: '#/components/schemas/headers/x-gdn-requestid'
        '412':
          description: Failed due to the precondition being violated. The response contains the found documents' current revisions in the *_rev* attributes. Additionally, the attributes *_id* and *_key* are returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/document_get_412'
          headers:
            x-gdn-region:
              schema:
                $ref: '#/components/schemas/headers/x-gdn-region'
            x-gdn-requestid:
              schema:
                $ref: '#/components/schemas/headers/x-gdn-requestid'
      summary: Update document
      tags:
      - Documents
    put:
      description: "Replaces the document with key <key> with the one in the body, provided there is such a document and no precondition is violated.\n\nIf the *If-Match* header is specified and the revision of the document in the database is unequal to the given revision, the precondition is violated.\n\nIf *If-Match* is not given and *ignoreRevs* is *false*, a *_rev* attribute in each document body must match the revision of the corresponding document in the database. Otherwise, the call fails.\n\nIf a precondition is violated, a *HTTP 412* is returned.\n\nIf the document exists and can be updated, a *HTTP 201* or a *HTTP 202* is returned (depending on *waitForSync*, see below), the *ETag* header field contains the new revision of the document and the *Location* header contains a URL under which the document can be queried.\n\nIf *silent* is set to *false*, the body of the response contains a JSON object with the information about the handle and the revision.\n - *_id* contains the known *document-handle* of each document.\n - *_key* contains the key that uniquely identifies a document.\n - *_rev* contains the new document revision.\n\nIf the query parameter *returnOld* is *true*, the previous revision of the document is returned under the *old* attribute in the result.\n\nIf the query parameter *returnNew* is *true*, the new document is returned under the *new* attribute in the result.\n\nIf the document does not exist, a *HTTP 404* is returned and the body of the response contains an error document."
      operationId: replaceDocument
      parameters:
      - in: path
        name: fabric
        required: true
        description: The name of the fabric.
        schema:
          type: string
          format: string
          default: _system
      - description: The name of the collection.
        in: path
        name: collection
        required: true
        schema:
          type: string
          format: string
      - description: This URL parameter must be a document key.
